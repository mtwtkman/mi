name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bash syntax and deployment regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z -- '*.sh' 'mi' 'setup' 'packages/*/location' 'packages/myscript/this/box-midep')

      - name: Run deployment regression tests
        shell: bash
        run: |
          bash tests/deploy.sh
          bash tests/install.sh
          bash tests/boxkit.sh
          bash tests/enter-box.sh
          bash tests/box-midep.sh
          bash tests/help.sh
          bash tests/backup-conflict.sh
